<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planche de rendus</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #ece7e1; margin: 16px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
    figure { margin: 0; background: #fff; padding: 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    canvas { width: 100%; height: auto; display: block; border: 1px solid #ddd; }
    figcaption { font-size: 13px; margin-top: 6px; color: #444; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module" src="gallery.js"></script>
</body>
</html>
